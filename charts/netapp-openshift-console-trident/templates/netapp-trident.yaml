  tasks:
  - description: |-
      To deploy the Trident Protect Operator:

      1. Click on [Operators]{{`{{highlight qs-nav-operators}}`}} and then click on **OperatorHub**.

      2. From the **OperatorHub** catalog, filter down the items by typing **netapp**, and click on the tile called **NetApp Trident**. 
        Acknolwedge the **Community Operator** message. 
      
      3. Click **Install** to open the installation wizard. The default settings are fitting most of the requirements, then click **Install**.

      4. The Trident Operator installation process will start. Once completed, a **green** check mark will appear. Click on **View Operator** to open Trident Operator details.

      **Note**: The Trident Operator can also be deployed using a Helm Charts or a descriptive YAML file, e.g. :
      ```YAML
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: trident-operator
        namespace: openshift-operators
      spec:
        channel: stable
        installPlanApproval: Automatic
        name: trident-operator
        source: community-operators
        sourceNamespace: openshift-marketplace
        startingCSV: trident-operator.v24.10.0
      ```
      Refer to the [NetApp Trident documentation](https://docs.netapp.com/us-en/trident/trident-get-started/intro.html) for more information.

