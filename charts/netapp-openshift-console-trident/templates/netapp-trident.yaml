    title: Install the Trident Operator
  - description: |-
      The Trident Orchestrator is the main component of the Trident suite. It is responsible for managing the storage resources and providing a unified interface to the storage systems. 
      
      To deploy the Trident Orchestrator:

      1. Click [Operators]{{`{{highlight qs-nav-operators}}`}}, then **Installed Operators**, and select **NetApp Trident** from the list. 
      2. From the Trident Operator details page, click the **Trident Orchestrator** tab.
      3. To verify the Trident Orchestrator deployment, click [Workloads]{{`{{highlight qs-nav-workloads}}`}}, then **Pods**.  
      Either filter down the list using the **Project** dropdown menu with the **trident** namespace or search for **trident-controller** in the search bar. 
      
      If deployed successfully, all the Pods should be in **Running** status. 

      **Note**: The Trident Orchestrator can also be deployed using a descriptive YAML file, e.g. :
      ```YAML
      apiVersion: trident.netapp.io/v1
      kind: TridentOrchestrator
      metadata:
        name: trident
        namespace: trident
      spec:
        IPv6: false
        debug: true
        enableNodePrep: true
        imagePullSecrets: []
        imageRegistry: ''
        k8sTimeout: 30
        kubeletDir: /var/lib/kubelet
        namespace: trident
        silenceAutosupport: false
      ```
      Refer to the [NetApp Trident documentation](https://docs.netapp.com/us-en/trident/trident-get-started/intro.html) for more information.

    review:
      failedTaskHelp: This task isn’t verified yet. Try the task again.
      instructions: |-
        #### To verify the build is complete:
        Do you see the Trident Orchestrator Pods in **Running** status within the **trident** namespace?
    summary:
      failed: Try the steps again.
      success: All the NetApp Trident Protect CRS are now deployed!
    title: Deploy a Trident Orchestrator
  - description: |-
      A Trident Backend configuration is required to manage the storage resources by connecting to the NetApp storage systems. In this example a NAS driver will be used to create Persistent Volumes with the NFS protocol. For other drivers like SAN, refer to the [NetApp Trident documentation](https://docs.netapp.com/us-en/trident/trident-get-started/intro.html).
      
      It requires the following information:
      1. Credentials to access the storage system.
      2. The NetApp storage system details like data LIF, SVM name, and protocol.

      To create a Trident Backend configuration:
      1. Create a **Secret** with the storage system credentials. Click on [Import]{{`{{highlight qs-masthead-import}}`}}, then insert a YAML definition like the following with necessary modification to fit your environment:  

      ```YAML
      apiVersion: v1
      kind: Secret
      metadata:
        name: trident-svm-credentials
        namespace: trident
      type: Opaque
      stringData:
        username: vsadmin
        password: 234TridentSVM
      ```
      **Note**: The Secret needs to be created with the same namespace as the Trident Orchestrator. Record the Secret name for the next step.

      2. Create a **TridentBackendConfig** with the storage system details. Click on [Import]{{`{{highlight qs-masthead-import}}`}}, then insert a YAML definition like the following with necessary modification to fit your environment:  

      ```YAML
      apiVersion: trident.netapp.io/v1
      kind: TridentBackendConfig
      metadata:
        name: trident-ontap-nas
        namespace: trident
      spec:
        version: 1
        backendName: ontap-nas
        storageDriverName: ontap-nas
        svm: fsx
        managementLIF: 10.0.0.154
        dataLIF: 10.0.0.154
        credentials:
          name: trident-svm-credentials
      ```
      2. Access the [TridentBackendConfig](api-resource/all-namespaces/trident.netapp.io~v1~TridentBackendConfig/instances) page to verify the configuration.
      3. Click on the TridentBackendConfig that was just created and verify that a **Bound** check mark is displayed next to the resource name, here: **trident-ontap-nas**.      

    review:
      failedTaskHelp: This task isn’t verified yet. Try the task again.
      instructions: |-
        Do you see the Secret details page open for **trident-svm-credentials**?
        Do you see the **Bound** check mark next to the TridentBackendConfig resource name? 
    summary:
      failed: Try the steps again.
      success: Congratulations, you now have access to your NetApp storage system!
    title: Create a Trident Backend configuration
  - description: |-
      ### Create a StorageClas:
      1. Click on [Import]{{`{{highlight qs-masthead-import}}`}}, then insert a YAML definition like the following with necessary modification to fit your environment:  

      ```YAML
      kind: StorageClass
      apiVersion: storage.k8s.io/v1
      metadata:
          name: trident-ontap-nas
      provisioner: csi.trident.netapp.io
      parameters:
          backendType: ontap-nas
          clones: 'true'
          fsType: ext4
          snapshots: 'true'
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      ```
      **Notes**: 
      - The StorageClass name provides the minimum configuration to create expandable Persistent Volume using the NAS driver, with the ability to create clones and snapshots.
      - The StorageClass is not set as the default one. If you want to set it as the default, add the following lines within the `metadata` section: 
      ```
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
      ```
      However, if there is already a default StorageClass, you will need to manually set the default status to `false` for the existing one.

    review:
      failedTaskHelp: This task isn’t verified yet. Try the task again.
      instructions: |-
        #### To verify the StorageClass was successfully created:
        Do you see the StorageClass details page open for **trident-ontap-nas** or within the StorageClass list?
    summary:
      failed: Try the steps again.
      success: You have created a StorageClass using the Trident NAS driver.
    title: Create a StorageClass with Trident
  - description: |-
      ### Create a StorageClas:
      1. Click on [Storage]{{`{{highlight qs-nav-storage}}`}}, then **PersistentVolumeClaims**. 
      2. Click on **Create PersistentVolumeClaim** to open the creation form.
      3. Select the **trident-ontap-nas** StorageClass from the dropdown menu.
      4. Fill in the form with the following information:
        - **Name**: *trident-pvc*  
        - **Access Mode**: *ReadWriteOnce*  
        - **Storage**: *1Gi*  
        - **Volume Mode**: *Filesystem*  

      then Click **Create** to create the PersistentVolumeClaim.

      To verify the PersistentVolumeClaim was successfully created:
      - check the PersistentVolumeClaim details page should be displayed a **Bound** status next to the resource name, here **trident-pvc**.
      - scroll down to observe the details of the associated **StorageClass** and **PersistentVolume** name which should display an output similar to `pvc-4fe2dd6e-cfde-455f-a2a2-778ba6f36cd8`.

      The PersistentVolumeClaim can now be delete as we verified the StorageClass creation.

    review:
      failedTaskHelp: This task isn’t verified yet. Try the task again.
      instructions: |-
        #### To verify the StorageClass was successfully created:
        Do you see a **Bound** check mark next to the resource name of the PersistentVolumeClaim?  
        Do you see **trident-ontap-nas** as the associated StorageClass in the PersistentVolumeClaim volume details?
    summary:
      failed: Try the steps again.
      success: Congratulations, Persistent Volumes can now be provisioned using the NetApp Trident Container Storage Interface.
    title: Create a test PersistentVolumeClaim with Trident